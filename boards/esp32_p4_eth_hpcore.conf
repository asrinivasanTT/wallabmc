# Waveshare ESP32-P4-ETH: Ethernet (internal EMAC + IP101 PHY) + HTTP web UI.
#
# The ESP32-P4 has no integrated Wi-Fi, so networking is wired Ethernet
# via the on-chip EMAC and the IP101 PHY (MDIO address 1, RMII, SMI
# MDC=GPIO31 / MDIO=GPIO52). NET_L2_ETHERNET is defaulted y by the
# board Kconfig.defconfig, so no Wi-Fi / NET_L2_WIFI_MGMT knobs apply.

# The ESP32-P4 Zephyr SoC support does not expose an RTC device, so the
# prj.conf default of CONFIG_RTC=y must be turned off here.
CONFIG_RTC=n

# Disable features that require hardware not wired up / not yet brought up.
CONFIG_APP_NTP=n
CONFIG_APP_SENSORS=n

# Host serial bridge: UART1 on GPIO2 TX / GPIO3 RX. The BMC's own console
# runs on UART0 via the on-board UART0 pins (delegated by the board DTS).
CONFIG_APP_CONSOLE_LOGGER=y
CONFIG_CONSOLE_BRIDGE=y
CONFIG_APP_WEB_TERMINAL_HOST_SERIAL=y

# Host power/reset GPIO aliases are defined in esp32_p4_eth_hpcore.overlay.
CONFIG_APP_HOST_POWER_PULSE=y

# Plain HTTP only for first bring-up. TLS (mbedtls) adds heap pressure
# that is worth revisiting once the basics work and PSRAM is enabled.
CONFIG_APP_HTTPS=n
